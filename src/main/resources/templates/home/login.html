<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
	<script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<title>Login</title>
</head>
<body>
<header th:replace="~{home/index::header}">
	<h1>Some header text</h1>
</header>
<main class="container">
	<h2 class="mt-4 mb-3">Login</h2>
	<div class="alert alert-info ms-2" role="alert" style="width: 18rem;">
		<span class="message">Please login to continue.</span>
	</div>
	<div th:if="${error}" class="alert alert-danger ms-2" role="alert" style="width: 18rem;">
		<span class="error">Login error.</span>
	</div>
	<form th:action="@{/login}" method="post">
		<div class="mt-3 ms-4" style="max-width: 16rem;">
			<label for="login" class="group-label form-label">Login</label><br/>
			<input id="login" type="text" name="username" class="form-control" required/>
		</div>
		<div class="mt-3 ms-4" style="max-width: 16rem;">
			<label for="password" class="group-label form-label">Password</label><br/>
			<input id="password" type="password" name="password" class="form-control" required/>
		</div>
		<div class="mt-3 ms-4" style="max-width: 16rem;">
			<div class="form-check">
				<label for="remember-me" class="group-label form-check-label">Remember Me</label>
				<input id="remember-me" type="checkbox" name="remember-me" class="form-check-input">
			</div>
		</div>
		<button type="submit" class="btn btn-primary mt-4 ms-2"><i class="bi bi-check-lg me-2"></i>Login</button>
	</form>
</main>
<footer th:replace="~{home/index::footer}">
	Some footer text
</footer>
</body>
</html>
