<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
	<script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<title>Login</title>
</head>
<body>
<header th:replace="~{home/index::header}">
	<h1>Some header text</h1>
</header>
<main class="container">
	<h1 class="mt-4 mb-3">Login</h1>
	<h2>Please login to continue.</h2>
	<p th:if="${error}" class="message">
		You did not log in successfully.
	</p>

	<form th:action="@{/login}" action="index.html" method="post">
		<p>
			<label for="login" class="group-label">Login</label><br/>
			<input id="login" type="text" name="username" required/>
		</p>
		<p>
			<label for="password" class="group-label">Password</label><br/>
			<input id="password" type="password" name="password" required/>
		</p>
		<p>
			<label class="group-label">Remember Me<input type="checkbox" name="remember-me"></label>
		</p>
		<button type="submit" class="btn btn-primary">Login<i class="ms-2 bi bi-check-lg"></i></button>
	</form>
</main>
<footer th:replace="~{home/index::footer}">
	Some footer text
</footer>
</body>
</html>
