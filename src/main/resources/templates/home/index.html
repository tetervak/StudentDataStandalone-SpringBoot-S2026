<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Index</title>
</head>
<body>
<header th:fragment="header" class="container d-flex flex-column align-items-center py-3 mb-4 border-bottom">
    <h1>Student Data</h1>
    <div class="navigation-bar nav mt-2 col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <div>
            <a th:href="@{/index}"><i class="bi bi-house-door me-2"></i>Home</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/students/index}"><i class="bi bi-mortarboard me-2"></i>Students</a>
        </div>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/users/index}"><i class="bi bi-people me-2"></i>Users</a>
        </div>
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-2"></i>Login</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
            </form>
        </div>
    </div>
</header>
<main class="container">
    <h2 class="mt-4 mb-3">Home</h2>
    <ul sec:authorize="isAuthenticated()">
        <li>
            <a th:href="@{/students/index}">Students</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/users/index}">Users</a>
        </li>
        <li>
            <a th:href="@{/password/change-password}">Change Password</a>
        </li>
    </ul>
    <div sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
        </form>
    </div>
    <p sec:authorize="isAnonymous()">
        <a th:href="@{/login}" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-2"></i>Login</a>
    </p>
</main>
<footer th:fragment="footer" class="container d-flex flex-column flex-wrap align-items-center py-3 mt-4 border-top">
    <div>PROG27545 / Web Application Design and Implementation</div>
    <div>Sheridan College, Alexander Tetervak</div>
    <div th:text="${#temporals.format(localDate, 'MMMM dd, yyyy')}">March 15, 2023</div>
</footer>
</body>
</html>
