<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Add User</title>
</head>
<body>
<header th:replace="~{home/index::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <h2 class="mt-4 mb-3">Add User</h2>
    <p th:text="${message}" class="message">Message</p>
    <form method="post" th:action="@{/users/insert-user}">
        <div class="mt-3 ms-4" style="max-width: 16rem;">
            <label for="login" class="group-label form-label">Login</label>
            <input id="login" type="text" name="login" th:value="${login}" class="form-control" required>
        </div>
        <div class="mt-3 ms-4" style="max-width: 16rem;">
            <label for="password" class="group-label form-label">Password</label>
            <input id="password" type="text" name="password" th:value="${random}" class="form-control" required>
        </div>
        <div class="mt-3 ms-4" style="max-width: 16rem;">
            <label class="group-label">Role</label><br/>
            <label><input type="radio" name="role" value="user" checked/>User</label>
            <label><input type="radio" name="role" value="admin"/>Admin</label>
        </div>

        <button type="submit" class="mt-4 btn btn-primary"><i class="bi bi-person-plus me-2"></i>Add Account</button>

    </form>
    <div class="mt-4">
        <a th:href="@{list-users}" href="list-users.html">List Users</a>
    </div>
</main>
<footer th:replace="~{home/index::footer}">
    Some footer text
</footer>
</body>
</html>
