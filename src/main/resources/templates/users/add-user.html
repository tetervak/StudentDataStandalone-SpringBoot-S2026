<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Add User</title>
</head>
<body>
<header>
    <div th:replace="~{navigation :: navigation-bar}">
        <ul class="navigation-bar">
            <li>
                <a th:href="@{/index}" href="../home/index.html">Home</a>
            </li>
        </ul>
    </div>
</header>
<main>
    <h1>Add User</h1>
    <p th:text="${message}" class="message">Message</p>
    <form method="post"
          th:action="@{insert-user}" action="user-added.html">
        <p>
            <label for="login" class="group-label">Login</label>
            <input id="login" type="text" name="login" th:value="${login}" required>
        </p>
        <p>
            <label for="password" class="group-label">Password</label>
            <input id="password" type="text" name="password" th:value="${random}" required>
        </p>
        <p>
            <label class="group-label">Role</label><br/>
            <label><input type="radio" name="role" value="user" checked/>User</label>
            <label><input type="radio" name="role" value="admin"/>Admin</label>
        </p>
        <p>
            <input type="submit" value="Add Account">
        </p>
    </form>
    <p>
        <a th:href="@{list-users}" href="list-users.html">List Users</a>
    </p>
</main>
<footer th:replace="~{home/index::footer}">
    Some footer text
</footer>
</body>
</html>
