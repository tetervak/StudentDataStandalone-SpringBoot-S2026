<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>List Users</title>
</head>
<body>
<header>
    <div th:replace="~{navigation :: navigation-bar}">
        <ul class="navigation-bar">
            <li>
                <a th:href="@{/index}" href="../home/index.html">Home</a>
            </li>
        </ul>
    </div>
</header>
<main>
    <h1>User List</h1>
    <h2>Role: User</h2>
    <p th:if="${#lists.isEmpty(users)}" class="message">No user accounts yet.</p>
    <table th:unless="${#lists.isEmpty(users)}">
        <tr>
            <th>Count</th>
            <th>Login</th>
            <th>Delete</th>
        </tr>
        <tr th:each="u,c:${users}">
            <td th:text="${c.count}">1</td>
            <td th:text="${u}">bart</td>
            <td><a th:href="@{delete-user(login=${u})}" href="delete-user.html">Delete</a></td>
        </tr>
    </table>

    <h2>Role: Admin</h2>
    <table>
        <tr>
            <th>Count</th>
            <th>Login</th>
            <th>Delete</th>
        </tr>
        <tr th:each="a,c:${admins}">
            <td th:text="${c.count}">1</td>
            <td th:text="${a}">marge</td>
            <td>
                <a th:unless="${#strings.equals(a, you)}"
                   th:href="@{delete-user(login=${a})}" href="delete-user.html">Delete</a>
                <span th:if="${#strings.equals(a, you)}" class="message">You</span>
            </td>
        </tr>
    </table>
    <p>
        <a th:href="@{add-user}" href="add-user.html">Add User</a>
    </p>
</main>
<footer th:replace="~{home/index::footer}">
    Some footer text
</footer>
</body>
</html>
