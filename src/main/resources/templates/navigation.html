<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Navigation</title>
</head>
<body>
<header>
    <div th:fragment="navigation-bar" class="navigation-bar">
        <div>
            <a th:href="@{/index}" href="home/index.html">Home</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/students/index}" href="students/students-index.html">Students</a>
        </div>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/users/index}" href="users/users-index.html">Users</a>
        </div>
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" href="home/login.html">Login</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>
</header>
<main>
    <h1>Main Section</h1>
</main>
</body>
</html>
