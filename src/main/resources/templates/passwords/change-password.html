<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>Change Password</title>
</head>
<body>
<header th:replace="~{home/index::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <h2 class="mt-4 mb-3">Change Password</h2>
    <div class="alert alert-info ms-2" role="alert" style="width: 20rem;">
        <span class="message">Enter your new password twice.</span>
    </div>
    <form th:object="${pcform}" th:action="@{/password/update-password}" method="post">
        <div class="mt-3 ms-4" style="max-width: 16rem;"
            th:with="fieldErrors=${#fields.hasErrors('currentPassword')}">
            <label for="currentPassword" class="group-label form-label">Current Password</label>
            <input id="currentPassword" th:field="*{currentPassword}" type="password"
                   th:class="|form-control ${fieldErrors?'is-invalid':''}|">
            <div th:if="${fieldErrors}" class="invalid-feedback"
                 th:errors="*{currentPassword}">
                Current Password Error
            </div>
        </div>
        <div class="mt-3 ms-4" style="max-width: 16rem;"
            th:with="fieldErrors=${#fields.hasErrors('newPassword1')}">
            <label for="newPassword1" class="group-label form-label">New Password</label>
            <input id="newPassword1" th:field="*{newPassword1}" type="password"
                   th:class="|form-control ${fieldErrors ?'is-invalid':''}|">
            <div th:if="${fieldErrors}" class="invalid-feedback"
                 th:errors="*{newPassword1}">
                New Password 1 Error
            </div>
        </div>
        <div class="mt-3 ms-4" style="max-width: 16rem;"
            th:with="fieldErrors = ${#fields.hasErrors('newPassword2')}">
            <label for="newPassword2" class="group-label form-label">Retype New Password</label>
            <input id="newPassword2" th:field="*{newPassword2}" type="password"
                   th:class="|form-control ${fieldErrors ? 'is-invalid' : ''}|">
            <div th:if="${fieldErrors}" class="invalid-feedback"
                 th:errors="*{newPassword2}">
                New Password 2 Error
            </div>
        </div>
        <button type="submit" class="mt-4 btn btn-primary"><i class="bi bi-floppy me-2"></i>Save</button>
    </form>
</main>
<footer th:replace="~{home/index::footer}">
    Some footer text
</footer>
</body>
</html>
