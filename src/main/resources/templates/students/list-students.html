<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <title>List Students</title>
</head>
<body>
<header th:replace="~{home/index::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <h2 class="mt-4 mb-3">List Students</h2>
    <table th:unless="${#lists.isEmpty(students)}" class="ms-4 table table-striped table-bordered w-auto">
        <thead>
            <tr class="table-primary">
                <th class="text-center align-middle">Count</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th class="text-center align-middle">Program</th>
                <th class="text-center align-middle">Options</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s,c: ${students}">
                <td class="text-center" th:text="${c.count}" >1</td>
                <td th:text="${s.firstName}">Bart</td>
                <td th:text="${s.lastName}">Simpson</td>
                <td class="text-center" th:text="${s.program.programName}">Program Name</td>
                <td class="text-center">
                    <a th:href="@{/students/student-details/{id}(id=${s.id})}"><i class="bi bi-info-circle"></i></a>
                    <span sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/students/edit-student(id=${s.id})}"><i class="ms-2 bi bi-pen"></i></a>
                        <a th:href="@{/students/delete-student(id=${s.id})}"><i class="ms-2 bi bi-trash"></i></a>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:if="${#lists.isEmpty(students)}" class="alert alert-warning ms-4" role="alert" style="width: 25rem;">
        <span class="text-warning">No student data</span>
    </div>

    <div sec:authorize="hasRole('ADMIN')" class="mt-4">
        <a th:href="@{/students/add-student}" class="btn btn-outline-primary"><i class="bi bi-plus me-2"></i>Add Student</a>
    </div>

    <form th:action="@{/students/delete-all}" method="post" sec:authorize="hasRole('ADMIN')" class="mt-3">
        <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash me-2"></i>Delete All</button>
    </form>

</main>
<footer th:replace="~{home/index::footer}">
    Some footer text
</footer>
</body>
</html>
